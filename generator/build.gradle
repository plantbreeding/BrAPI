apply plugin : "java"
ext {
  javaMainClass = 'org.brapi.schematools.cli.BrAPICommand'
  brapiSchemaToolsVersion = '0.30.0-SNAPSHOT'
}

repositories {
  mavenCentral()
  maven {url 'https://s01.oss.sonatype.org/content/repositories/snapshots/'}
}

dependencies {
  implementation "org.brapi:brapi-schema-tools-cli:$brapiSchemaToolsVersion"
}

tasks.register("validate", JavaExec) {
  group = 'BrAPI'
  description = 'Validate the Json Schema'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = javaMainClass
  workingDir = '../'
  args = ['validate', 'Specification/BrAPI-Schema', '-x']
}

tasks.register("generateGraphQL", JavaExec) {
  group = 'BrAPI'
  description = 'Generate GraphQL schema from the Json Schema'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = javaMainClass
  workingDir = '../'
  def filename = "Specification/Generated/brapi_generated.graphqls"
  args = ['generate',
          'Specification/BrAPI-Schema',
          '-l', 'GRAPHQL',
          '-f', filename,
          '-x']
}

tasks.register("generateOpenAPI", JavaExec) {
  group = 'BrAPI'
  description = 'Generate OpenAPI schema from the Json Schema'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = javaMainClass
  workingDir = '../'
  def filename = "Specification/Generated/brapi_generated.json"
  args = ['generate', 'Specification/BrAPI-Schema',
          '-l', 'OPEN_API',
          '-f', filename,
          '-c', 'Specification/OpenAPI-Components',
          '-x']
}

tasks.register("compareOpenAPI", JavaExec) {
  group = 'BrAPI'
  description = 'Compares the generated OpenAPI schema with the compiled version'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = javaMainClass
  workingDir = '../'
  def filename1 = "Specification/Generated/brapi_compiled.json"
  def filename2 = "Specification/Generated/brapi_generated.json"
  def filename = "Specification/Generated/brapi_comparison.md"
  args = ['compare', filename1, filename2,
          '-l', 'OPEN_API',
          '-w', 'MARKDOWN',
          '-f', filename,
          '-x',
          '-s']
}

tasks.register("generateOWL", JavaExec) {
  group = 'BrAPI'
  description = 'Generate OWL schema from the Json Schema'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = javaMainClass
  workingDir = '../'
  def filename = "Specification/Generated/brapi_generated.ttl"
  args = ['generate', 'Specification/BrAPI-Schema',
          '-l', 'OWL',
          '-f', filename,
          '-m', 'generator/ont-model-metadata.yaml',
          '-x']
}

tasks.register("generateAll") {
  dependsOn generateGraphQL
  dependsOn generateOpenAPI
  dependsOn generateOWL
}