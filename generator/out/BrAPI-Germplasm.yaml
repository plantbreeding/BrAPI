      - name: methodDbId
        in: query
        description: List of methods to filter search results
        required: false
        schema:
          type: string
      - name: methodName
        in: query
        description: |-
          Human readable name for the method
          <br/>MIAPPE V1.1 (DM-88) Method  Name of the method of observation
        required: false
        schema:
          type: string
      - name: methodPUI
        in: query
        description: "The Permanent Unique Identifier of a Method, usually in the\
          \ form of a URI"
        required: false
        schema:
          type: string
      - name: scaleDbId
        in: query
        description: The unique identifier for a Scale
        required: false
        schema:
          type: string
      - name: scaleName
        in: query
        description: |-
          Name of the scale
          <br/>MIAPPE V1.1 (DM-92) Scale Name of the scale associated with the variable
        required: false
        schema:
          type: string
      - name: scalePUI
        in: query
        description: "The Permanent Unique Identifier of a Scale, usually in the form\
          \ of a URI"
        required: false
        schema:
          type: string
      - name: traitDbId
        in: query
        description: The unique identifier for a Trait
        required: false
        schema:
          type: string
      - name: traitName
        in: query
        description: |-
          The human readable name of a trait
          <br/>MIAPPE V1.1 (DM-86) Trait - Name of the (plant or environmental) trait under observation
        required: false
        schema:
          type: string
      - name: traitPUI
        in: query
        description: "The Permanent Unique Identifier of a Trait, usually in the form\
          \ of a URI"
        required: false
        schema:
          type: string
      - name: attributeDbId
        in: query
        description: List of Germplasm Attribute IDs to search for
        required: false
        schema:
          type: string
      - name: attributeName
        in: query
        description: List of human readable Germplasm Attribute names to search for
        required: false
        schema:
          type: string
      - name: attributePUI
        in: query
        description: "The Permanent Unique Identifier of an Attribute, usually in\
          \ the form of a URI"
        required: false
        schema:
          type: string
      - name: attributeCategory
        in: query
        description: General category for the attribute. very similar to Trait class.
        required: false
        schema:
          type: string
      - $ref: "#/components/parameters/externalReferenceID"
      - $ref: "#/components/parameters/externalReferenceId"
      - $ref: "#/components/parameters/externalReferenceSource"
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/authorizationHeader"
      responses:
        "200":
          $ref: "#/components/responses/GermplasmAttributeListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
    post:
      tags:
      - GermplasmAttributes
      summary: Create new GermplasmAttribute
      description: Add new GermplasmAttribute to database
      parameters:
      - $ref: "#/components/parameters/authorizationHeader"
      requestBody:
