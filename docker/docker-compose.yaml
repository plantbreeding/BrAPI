services:
  build-docs:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    volumes:
      - ../Specification:/src/Specification
      - ../build:/src/build
    working_dir: /src
    command: ["./Scripts/buildDocs.sh" ]
  gen-swagger:
    volumes:
      - ../build:/src/build
    image: openapitools/openapi-generator-cli
    command: generate -i /src/build/brapi_openapi.yaml -g openapi -o /src/build