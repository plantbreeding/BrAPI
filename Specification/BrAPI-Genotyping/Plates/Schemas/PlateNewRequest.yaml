info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    PlateNewRequest:
      type: object
      required:
      - plateName
      properties:
        additionalInfo:
          additionalProperties:
            type: string
          description: A free space containing any additional information related to a particular object. A data source may provide any JSON object, unrestricted by the BrAPI specification.
          type: object
          nullable: true
        plateName:
          description: A human readable name for a `Plate`
          type: string
          example: Plate_123_XYZ
        plateBarcode:
          description: A unique identifier physically attached to a `Plate`
          type: string
          example: '11223344'
        sampleType:
          description: The type of samples taken. ex. 'DNA', 'RNA', 'Tissue', etc
          type: string
          nullable: true
          enum:
          - DNA
          - RNA
          - TISSUE
          - MIXED
          example: TISSUE
        studyDbId:
          description: The ID which uniquely identifies a `Study` within the given database server
          type: string
          nullable: true
          example: 64bd6bf9
        trialDbId: 
          description: The ID which uniquely identifies a `Trial` within the given database server
          type: string
          nullable: true
          example: d34c5349
        programDbId: 
          description: The ID which uniquely identifies a `Program` within the given database server
          type: string
          nullable: true
          example: bd748e00
        plateFormat:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PlateFormat'
        externalReferences:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ExternalReferences'
          

