info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    VendorPlate:
      type: object
      properties:
        clientPlateBarcode:
          description: (Optional) The value of the bar code attached to this plate
          type: string
          nullable: true
          example: 31dd5787
        clientPlateId:
          description: The ID which uniquely identifies this plate to the client making the request
          type: string
          nullable: true
          example: 0ad6c0ef
        sampleSubmissionFormat:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PlateFormat'
        samples:
          items:
            $ref: '#/components/schemas/VendorSample'
          type: array
          nullable: true

