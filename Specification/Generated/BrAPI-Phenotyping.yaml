components:
  schemas:
    AdditionalInfo:
      type: string
      additionalProperties:
        description: A free space containing any additional information related to
          a particular object.
      description: "A free space containing any additional information related to\
        \ a particular object. A data source may provide any JSON object, unrestricted\
        \ by the BrAPI specification."
      nullable: true
    AlleleMatrixPagination:
      type: object
      properties:
        dimension:
          type: string
          description: the dimension of the matrix being paginated
          example: VARIANTS
          enum:
          - CALLSETS
          - VARIANTS
        page:
          type: integer
          description: the requested page number (zero indexed)
          format: int32
          example: 0
        pageSize:
          type: integer
          description: the maximum number of elements per page in this dimension of
            the matrix
          format: int32
          example: 500
    AlleleMatrixRequest:
      type: object
      properties:
        callSetDbIds:
          type: array
          description: A list of IDs which uniquely identify `CallSets` within the
            given database server
          items:
            type: string
        dataMatrixAbbreviations:
          type: array
          description: "`dataMatrixAbbreviations` is a comma seperated list of abbreviations\
            \ (ie 'GT', 'RD' etc). This list controls which data matrices are returned\
            \ in the response."
          items:
            type: string
        dataMatrixNames:
          type: array
          description: "`dataMatrixNames` is a list of names (ie 'Genotype', 'Read\
            \ Depth' etc). This list controls which data matrices are returned in\
            \ the response."
          items:
            type: string
        expandHomozygotes:
          type: boolean
          description: Should homozygotes be expanded (true) or collapsed into a single
            occurrence (false)
          example: true
        germplasmDbIds:
          type: array
          description: A list of IDs which uniquely identify `Germplasm` within the
            given database server
          items:
            type: string
        germplasmNames:
          type: array
          description: A list of human readable `Germplasm` names
          items:
            type: string
        germplasmPUIs:
          type: array
          description: A list of permanent unique identifiers associated with `Germplasm`
          items:
            type: string
        pagination:
          type: array
          description: Pagination for the matrix
          items:
            type: object
            properties:
              dimension:
                type: string
                description: the dimension of the matrix being paginated
                example: VARIANTS
                enum:
                - CALLSETS
                - VARIANTS
              page:
                type: integer
                description: the requested page number (zero indexed)
                format: int32
                example: 0
              pageSize:
                type: integer
                description: the maximum number of elements per page in this dimension
                  of the matrix
                format: int32
                example: 500
        positionRanges:
          type: array
          description: "The postion range to search\n<br/>\nUses the format \"<chrom>:<start>-<end>\"\
            \ where <chrom> is the chromosome name, <start> is \nthe starting position\
            \ of the range, and <end> is the ending position of the range"
          items:
            type: string
        preview:
          type: boolean
          description: "Default Value = false\n<br/>\nIf 'preview' is set to true,\
            \ then the server should only return the lists of 'callSetDbIds', \n'variantDbIds',\
            \ and 'variantSetDbIds'. The server should not return any matrix data.\
            \ This\nis intended to be a preview and give the client a sense of how\
            \ large the matrix returned will be\n<br/>\nIf 'preview' is set to false\
            \ or not set (default), then the server should return all the matrix\n\
            data as requested."
          example: true
        sampleDbIds:
          type: array
          description: A list of IDs which uniquely identify `Samples` within the
            given database server
          items:
            type: string
        sepPhased:
          type: string
          description: The string used as a separator for phased allele calls.
          example: '|'
        sepUnphased:
          type: string
          description: The string used as a separator for unphased allele calls.
          example: /
        unknownString:
          type: string
          description: The string used as a representation for missing data.
          example: "."
        variantDbIds:
          type: array
          description: A list of IDs which uniquely identify `Variants` within the
            given database server
          items:
            type: string
        variantSetDbIds:
          type: array
          description: A list of IDs which uniquely identify `VariantSets` within
            the given database server
          items:
            type: string
    Attribute:
      required:
      - attributeName
      - methodDbId
      - methodName
      - scaleDbId
      - scaleName
      - traitName
      type: object
      properties:
        additionalInfo:
          $ref: "#/components/schemas/AdditionalInfo"
        attributeCategory:
          type: string
          description: General category for the attribute. very similar to Trait class.
          example: Morphological
        attributeDbId:
          type: string
          description: The ID which uniquely identifies this attribute within the
            given database server
        attributeDescription:
          type: string
          description: A human readable description of this attribute
          example: Height of the plant measured in meters by a tape
        attributeName:
          type: string
          description: A human readable name for this attribute
          example: Plant Height 1
        attributePUI:
          type: string
          description: "The Permanent Unique Identifier of an Attribute, usually in\
            \ the form of a URI"
          example: http://my-traits.com/trait/CO_123:0008012
        commonCropName:
          type: string
          description: "Crop name (examples: \"Maize\", \"Wheat\")"
          nullable: true
        contextOfUse:
          type: array
          description: "Indication of how trait is routinely used. (examples: [\"\
            Trial evaluation\", \"Nursery evaluation\"])"
          nullable: true
          items:
            type: string
        defaultValue:
          type: string
          description: "Variable default value. (examples: \"red\", \"2.3\", etc.)"
          nullable: true
        documentationURL:
          type: string
          description: A URL to the human readable documentation of an object
          format: uri
          nullable: true
        externalReferences:
          type: array
          description: An array of external reference ids. These are references to
            this piece of data in an external system. Could be a simple string or
            a URI.
          nullable: true
          items:
            $ref: "#/components/schemas/ExternalReference"
        growthStage:
          type: string
          description: "Growth stage at which measurement is made (examples: \"flowering\"\
            )"
          nullable: true
        institution:
          type: string
          description: Name of institution submitting the variable
          nullable: true
        language:
          type: string
          description: 2 letter ISO 639-1 code for the language of submission of the
            variable.
          nullable: true
        methodDbId:
          type: string
        methodName:
          type: string
        methodPUI:
          type: string
        ontologyReference:
          $ref: "#/components/schemas/OntologyReference"
        scaleDbId:
          type: string
        scaleName:
          type: string
        scalePUI:
          type: string
        scientist:
          type: string
          description: Name of scientist submitting the variable.
          nullable: true
        status:
          type: string
          description: "Variable status. (examples: \"recommended\", \"obsolete\"\
            , \"legacy\", etc.)"
          nullable: true
        submissionTimestamp:
          type: string
          description: Timestamp when the Variable was added (ISO 8601)
          format: date-time
          nullable: true
        synonyms:
          type: array
          description: Other variable names
          nullable: true
          items:
            type: string
        traitDbId:
          type: string
        traitName:
          type: string
        traitPUI:
          type: string
    CallRequest:
      type: object
      properties:
        callSetDbIds:
          type: array
          description: A list of IDs which uniquely identify `CallSets` within the
            given database server
          items:
            type: string
        expandHomozygotes:
          type: boolean
          description: Should homozygotes be expanded (true) or collapsed into a single
            occurrence (false)
          example: true
        sepPhased:
          type: string
          description: The string used as a separator for phased allele calls.
          example: '|'
        sepUnphased:
          type: string
          description: The string used as a separator for unphased allele calls.
          example: /
        unknownString:
          type: string
          description: The string used as a representation for missing data.
          example: "."
        variantDbIds:
          type: array
          description: A list of IDs which uniquely identify `Variant` within the
            given database server
          items:
            type: string
        variantSetDbIds:
          type: array
          description: A list of IDs which uniquely identify `VariantSets` within
            the given database server
          items:
            type: string
    CallSetRequest:
      type: object
      properties:
        callSetDbIds:
          type: array
          description: A list of IDs which uniquely identify `CallSets` within the
            given database server
          items:
            type: string
        callSetNames:
          type: array
          description: A list of human readable names associated with `CallSets`
          items:
            type: string
        commonCropNames:
          type: array
          description: "The BrAPI Common Crop Name is the simple, generalized, widely\
            \ accepted name of the organism being researched. It is most often used\
            \ in multi-crop systems where digital resources need to be divided at\
            \ a high level. Things like 'Maize', 'Wheat', and 'Rice' are examples\
            \ of common crop names.\n\nUse this parameter to only return results associated\
            \ with the given crops. \n\nUse `GET /commoncropnames` to find the list\
            \ of available crops on a server."
          items:
            type: string
        germplasmDbIds:
          type: array
          description: List of IDs which uniquely identify germplasm to search for
          items:
            type: string
        germplasmNames:
          type: array
          description: List of human readable names to identify germplasm to search
            for
          items:
            type: string
        programDbIds:
          type: array
          description: "A BrAPI Program represents the high level organization or\
            \ group who is responsible for conducting trials and studies. Things like\
            \ Breeding Programs and Funded Projects are considered BrAPI Programs.\
            \ \n\nUse this parameter to only return results associated with the given\
            \ programs. \n\nUse `GET /programs` to find the list of available programs\
            \ on a server."
          items:
            type: string
        programNames:
          type: array
          description: |-
            Use this parameter to only return results associated with the given program names. Program names are not required to be unique.

            Use `GET /programs` to find the list of available programs on a server.
          items:
            type: string
        sampleDbIds:
          type: array
          description: A list of IDs which uniquely identify `Samples` within the
            given database server
          items:
            type: string
        sampleNames:
          type: array
          description: A list of human readable names associated with `Samples`
          items:
            type: string
        studyDbIds:
          type: array
          description: List of study identifiers to search for
          items:
            type: string
        studyNames:
          type: array
          description: List of study names to filter search results
          items:
            type: string
        trialDbIds:
          type: array
          description: The ID which uniquely identifies a trial to search for
          items:
            type: string
        trialNames:
          type: array
          description: The human readable name of a trial to search for
          items:
            type: string
        variantSetDbIds:
          type: array
          description: A list of IDs which uniquely identify `VariantSets` within
            the given database server
          items:
            type: string
    CommonCropNamesParameters:
      type: object
      properties:
        commonCropNames:
          type: array
          description: "The BrAPI Common Crop Name is the simple, generalized, widely\
            \ accepted name of the organism being researched. It is most often used\
            \ in multi-crop systems where digital resources need to be divided at\
            \ a high level. Things like 'Maize', 'Wheat', and 'Rice' are examples\
            \ of common crop names.\n\nUse this parameter to only return results associated\
            \ with the given crops. \n\nUse `GET /commoncropnames` to find the list\
            \ of available crops on a server."
          items:
            type: string
    ContentTypes:
      type: string
      enum:
      - application/json
      - text/csv
      - text/tsv
      - application/flapjack
    Context:
      title: context
      type: array
      description: "The JSON-LD Context is used to provide JSON-LD definitions to\
        \ each field in a JSON object. By providing an array of context file urls,\
        \ a BrAPI response object becomes JSON-LD compatible.  \n\nFor more information,\
        \ see https://w3c.github.io/json-ld-syntax/#the-context"
      example:
      - https://brapi.org/jsonld/context/metadata.jsonld
      items:
        type: string
        format: uri
    CrossRequest:
      type: object
