        - observationUnitDbId
        type: object
        properties:
          observationUnitDbId:
            type: string
            description: "The ID which uniquely identifies an observation unit\n\n\
              MIAPPE V1.1 (DM-70) Observation unit ID - Identifier used to identify\
              \ the observation unit in data files containing the values observed\
              \ or measured on that unit. Must be locally unique. "
        description: "A representation of the physical entity being observed during\
          \ a phenotype data collection process. Typically, this is a Plot or a Plant,\
          \ but it could include things like Fields, Blocks, or Samples."
    ObservationUnitHierarchyLevel:
      type: object
      properties:
        levelName:
          type: string
          description: "A name for this level \n\n**Standard Level Names: study, field,\
            \ entry, rep, block, sub-block, plot, sub-plot, plant, pot, sample** \n\
            \nFor more information on Observation Levels, please review the <a target=\"\
            _blank\" href=\"https://wiki.brapi.org/index.php/Observation_Levels\"\
            >Observation Levels documentation</a>. "
          nullable: true
        levelOrder:
          type: integer
          description: "`levelOrder` defines where that level exists in the hierarchy\
            \ of levels. `levelOrder`'s lower numbers \nare at the top of the hierarchy\
            \ (ie field -> 1) and higher numbers are at the bottom of the hierarchy\
            \ (ie plant -> 9). \n\nFor more information on Observation Levels, please\
            \ review the <a target=\"_blank\" href=\"https://wiki.brapi.org/index.php/Observation_Levels\"\
            >Observation Levels documentation</a>. "
          format: int32
          nullable: true
      description: "The exact level and level code of an observation unit. \n\nFor\
        \ more information on Observation Levels, please review the <a target=\"_blank\"\
        \ href=\"https://wiki.brapi.org/index.php/Observation_Levels\">Observation\
        \ Levels documentation</a>. \n\nMIAPPE V1.1 DM-71 Observation unit type \"\
        Type of observation unit in textual form, usually one of the following: study,\
        \ block, sub-block, plot, sub-plot, pot, plant. Use of other observation unit\
        \ types is possible but not recommended. \nThe observation unit type can not\
        \ be used to indicate sub-plant levels. However, observations can still be\
        \ made on the sub-plant level, as long as the details are indicated in the\
        \ associated observed variable (see observed variables). \nAlternatively,\
        \ it is possible to use samples for more detailed tracing of sub-plant units,\
        \ attaching the observations to them instead.\" "
    ObservationUnitLevel:
      type: object
      properties:
        levelCode:
          type: string
          description: "An ID code or number to represent a real thing that may or\
            \ may not be an an observation unit.\n<br/>For example, if the 'levelName'\
            \ is 'plot', then the 'levelCode' would be the plot number or plot barcode.\
            \ If this plot is also considered an ObservationUnit, then the appropriate\
            \ observationUnitDbId should also be recorded.\n<br/>If the 'levelName'\
            \ is 'field', then the 'levelCode' might be something like '3' or 'F3'\
            \ to indicate the third field at a research station. "
          nullable: true
        levelName:
          type: string
          description: "A name for this level \n\n**Standard Level Names: study, field,\
            \ entry, rep, block, sub-block, plot, sub-plot, plant, pot, sample** \n\
            \nFor more information on Observation Levels, please review the <a target=\"\
            _blank\" href=\"https://wiki.brapi.org/index.php/Observation_Levels\"\
            >Observation Levels documentation</a>. "
          nullable: true
        levelOrder:
          type: integer
          description: "`levelOrder` defines where that level exists in the hierarchy\
            \ of levels. `levelOrder`'s lower numbers \nare at the top of the hierarchy\
            \ (ie field -> 1) and higher numbers are at the bottom of the hierarchy\
            \ (ie plant -> 9). \n\nFor more information on Observation Levels, please\
            \ review the <a target=\"_blank\" href=\"https://wiki.brapi.org/index.php/Observation_Levels\"\
            >Observation Levels documentation</a>. "
          format: int32
          nullable: true
      description: "The exact level and level code of an observation unit. \n\nFor\
        \ more information on Observation Levels, please review the <a target=\"_blank\"\
        \ href=\"https://wiki.brapi.org/index.php/Observation_Levels\">Observation\
        \ Levels documentation</a>. \n\nMIAPPE V1.1 DM-71 Observation unit type \"\
        Type of observation unit in textual form, usually one of the following: study,\
        \ block, sub-block, plot, sub-plot, pot, plant. Use of other observation unit\
        \ types is possible but not recommended. \nThe observation unit type can not\
