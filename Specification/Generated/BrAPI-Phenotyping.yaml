            \ must be before `searchDateRangeEnd`.\n\nReturn a Trial entity if any\
            \ of the following cases are true\n\n- `searchDateRangeStart` is before\
            \ `trial.endDate` AND `searchDateRangeEnd` is null \n\n- `searchDateRangeStart`\
            \ is before `trial.endDate` AND `searchDateRangeEnd` is after `trial.startDate`\n\
            \n- `searchDateRangeEnd` is after `trial.startDate` AND `searchDateRangeStart`\
            \ is null\n\n- `searchDateRangeEnd` is after `trial.startDate` AND `searchDateRangeStart`\
            \ is before `trial.endDate`"
          format: date
