openapi: 3.0.1
info:
  title: BrAPI-Phenotyping
  version: "2.1"
paths:
  /events:
    get:
      tags:
      - Events
      summary: Get a filtered list of Event
      description: Get a list of Event
      parameters:
      - name: studyDbId
        in: query
        description: List of study identifiers to search for
        required: false
        schema:
          type: string
      - name: observationUnitDbId
        in: query
        description: The ID which uniquely identifies an observation unit.
        required: false
        schema:
          type: string
      - name: eventDbId
        in: query
        description: Filter based on an Event DbId.
        required: false
        schema:
          type: string
      - name: eventType
        in: query
        description: Filter based on an Event Type
        required: false
        schema:
          type: string
      - name: dateRangeStart
        in: query
        description: Filter based on an Event start date.
        required: false
        schema:
          type: string
          format: date-time
      - name: dateRangeEnd
        in: query
        description: Filter based on an Event start date.
        required: false
        schema:
          type: string
          format: date-time
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/authorizationHeader"
      responses:
        "200":
          $ref: "#/components/responses/EventListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
  /images:
    get:
      tags:
      - Images
      summary: Get a filtered list of Image
      description: Get a list of Image
      parameters:
      - name: commonCropName
        in: query
        description: "The BrAPI Common Crop Name is the simple, generalized, widely\
          \ accepted name of the organism being researched. It is most often used\
          \ in multi-crop systems where digital resources need to be divided at a\
          \ high level. Things like 'Maize', 'Wheat', and 'Rice' are examples of common\
          \ crop names.\n\nUse this parameter to only return results associated with\
          \ the given crops. \n\nUse `GET /commoncropnames` to find the list of available\
          \ crops on a server."
        required: false
        schema:
          type: string
      - name: programDbId
        in: query
        description: "A BrAPI Program represents the high level organization or group\
          \ who is responsible for conducting trials and studies. Things like Breeding\
          \ Programs and Funded Projects are considered BrAPI Programs. \n\nUse this\
          \ parameter to only return results associated with the given programs. \n\
          \nUse `GET /programs` to find the list of available programs on a server."
        required: false
        schema:
          type: string
      - name: descriptiveOntologyTerm
        in: query
        description: "A list of terms to formally describe the image to search for.\
          \ Each item could be a simple Tag, an Ontology reference Id, or a full ontology\
          \ URL."
        required: false
        schema:
          type: string
      - name: imageName
        in: query
        description: Human readable names to search for.
        required: false
        schema:
          type: string
      - name: observationDbId
        in: query
        description: A list of observation Ids this image is associated with to search
          for
        required: false
        schema:
          type: string
      - name: imageDbId
        in: query
        description: A list of image Ids to search for
        required: false
        schema:
          type: string
      - name: observationUnitDbId
        in: query
        description: A set of observation unit identifiers to search for.
        required: false
        schema:
          type: string
      - $ref: "#/components/parameters/externalReferenceId"
      - $ref: "#/components/parameters/externalReferenceID"
      - $ref: "#/components/parameters/externalReferenceSource"
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/authorizationHeader"
      responses:
        "200":
          $ref: "#/components/responses/ImageListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
    post:
      tags:
      - Images
      summary: Create new Image
      description: Add new Image to database
      parameters:
      - $ref: "#/components/parameters/authorizationHeader"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ImageNewRequest"
      responses:
        "200":
          $ref: "#/components/responses/ImageListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
  /methods:
    get:
      tags:
      - Methods
      summary: Get a filtered list of Method
      description: Get a list of Method
      parameters:
      - name: commonCropName
        in: query
        description: "The BrAPI Common Crop Name is the simple, generalized, widely\
          \ accepted name of the organism being researched. It is most often used\
          \ in multi-crop systems where digital resources need to be divided at a\
          \ high level. Things like 'Maize', 'Wheat', and 'Rice' are examples of common\
          \ crop names.\n\nUse this parameter to only return results associated with\
          \ the given crops. \n\nUse `GET /commoncropnames` to find the list of available\
          \ crops on a server."
        required: false
        schema:
          type: string
      - name: ontologyDbId
        in: query
        description: "The unique identifier for an ontology definition. Use this parameter\
          \ to filter results based on a specific ontology \n\n  Use `GET /ontologies`\
          \ to find the list of available ontologies on a server."
        required: false
        schema:
          type: string
      - name: programDbId
        in: query
        description: "A BrAPI Program represents the high level organization or group\
          \ who is responsible for conducting trials and studies. Things like Breeding\
          \ Programs and Funded Projects are considered BrAPI Programs. \n\nUse this\
          \ parameter to only return results associated with the given programs. \n\
          \nUse `GET /programs` to find the list of available programs on a server."
        required: false
        schema:
          type: string
      - name: methodDbId
        in: query
        description: The unique identifier for a method.
        required: false
        schema:
          type: string
      - name: observationVariableDbId
        in: query
        description: The unique identifier for an observation variable.
        required: false
        schema:
          type: string
      - $ref: "#/components/parameters/externalReferenceId"
      - $ref: "#/components/parameters/externalReferenceID"
      - $ref: "#/components/parameters/externalReferenceSource"
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/authorizationHeader"
      responses:
        "200":
          $ref: "#/components/responses/MethodListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
    post:
      tags:
      - Methods
      summary: Create new Method
      description: Add new Method to database
      parameters:
      - $ref: "#/components/parameters/authorizationHeader"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/MethodNewRequest"
      responses:
        "200":
          $ref: "#/components/responses/MethodListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
  /observations:
    get:
      tags:
      - Observations
      summary: Get a filtered list of Observation
      description: Get a list of Observation
      parameters:
      - name: commonCropName
        in: query
        description: "The BrAPI Common Crop Name is the simple, generalized, widely\
          \ accepted name of the organism being researched. It is most often used\
          \ in multi-crop systems where digital resources need to be divided at a\
          \ high level. Things like 'Maize', 'Wheat', and 'Rice' are examples of common\
          \ crop names.\n\nUse this parameter to only return results associated with\
          \ the given crops. \n\nUse `GET /commoncropnames` to find the list of available\
          \ crops on a server."
        required: false
        schema:
          type: string
      - name: germplasmDbId
        in: query
        description: List of IDs which uniquely identify germplasm to search for
        required: false
        schema:
          type: string
      - name: locationDbId
        in: query
        description: The location ids to search for
        required: false
        schema:
          type: string
      - name: observationVariableDbId
        in: query
        description: The DbIds of Variables to search for
        required: false
        schema:
          type: string
      - name: programDbId
        in: query
        description: "A BrAPI Program represents the high level organization or group\
          \ who is responsible for conducting trials and studies. Things like Breeding\
          \ Programs and Funded Projects are considered BrAPI Programs. \n\nUse this\
          \ parameter to only return results associated with the given programs. \n\
          \nUse `GET /programs` to find the list of available programs on a server."
        required: false
        schema:
          type: string
      - name: studyDbId
        in: query
        description: List of study identifiers to search for
        required: false
        schema:
          type: string
      - name: trialDbId
        in: query
        description: The ID which uniquely identifies a trial to search for
        required: false
        schema:
          type: string
      - name: observationDbId
        in: query
        description: The unique id of an Observation
        required: false
        schema:
          type: string
      - name: observationUnitDbId
        in: query
        description: The unique id of an Observation Unit
        required: false
        schema:
          type: string
      - name: observationUnitLevelName
        in: query
        description: "The Observation Unit Level. Returns only the observation unit\
          \ of the specified Level. \n<br/>References ObservationUnit->observationUnitPosition->observationLevel->levelName\
          \ \n<br/>**Standard Level Names: study, field, entry, rep, block, sub-block,\
          \ plot, sub-plot, plant, pot, sample** \n<br/>For more information on Observation\
          \ Levels, please review the <a target=\"_blank\" href=\"https://wiki.brapi.org/index.php/Observation_Levels\"\
          >Observation Levels documentation</a>. "
        required: false
        schema:
          type: string
      - name: observationUnitLevelOrder
        in: query
        description: "The Observation Unit Level Order Number. Returns only the observation\
          \ unit of the specified Level. \nReferences ObservationUnit->observationUnitPosition->observationLevel->levelOrder\
          \ \n<br/>For more information on Observation Levels, please review the <a\
          \ target=\"_blank\" href=\"https://wiki.brapi.org/index.php/Observation_Levels\"\
          >Observation Levels documentation</a>. "
        required: false
        schema:
          type: string
      - name: observationUnitLevelCode
        in: query
        description: "The Observation Unit Level Code. This parameter should be used\
          \ together with `observationUnitLevelName` \nor `observationUnitLevelOrder`.\
          \ References ObservationUnit->observationUnitPosition->observationLevel->levelCode\
          \ \n<br/>For more information on Observation Levels, please review the <a\
          \ target=\"_blank\" href=\"https://wiki.brapi.org/index.php/Observation_Levels\"\
          >Observation Levels documentation</a>. "
        required: false
        schema:
          type: string
      - name: observationUnitLevelRelationshipName
        in: query
        description: "The Observation Unit Level Relationship is a connection that\
          \ this observation unit has to another level of the hierarchy. \n<br/>For\
          \ example, if you have several observation units at a 'plot' level, they\
          \ might all share a relationship to the same 'field' level.  \n<br/>Use\
          \ this parameter to identify groups of observation units that share a relationship\
          \ level. \n<br/>**Standard Level Names: study, field, entry, rep, block,\
          \ sub-block, plot, sub-plot, plant, pot, sample** \n<br/>For more information\
          \ on Observation Levels, please review the <a target=\"_blank\" href=\"\
          https://wiki.brapi.org/index.php/Observation_Levels\">Observation Levels\
          \ documentation</a>. "
        required: false
        schema:
          type: string
      - name: observationUnitLevelRelationshipOrder
        in: query
        description: "The Observation Unit Level Order Number. \n<br/>Returns only\
          \ the observation unit of the specified Level. References ObservationUnit->observationUnitPosition->observationLevel->levelOrder\
          \ \n<br/>For more information on Observation Levels, please review the <a\
          \ target=\"_blank\" href=\"https://wiki.brapi.org/index.php/Observation_Levels\"\
          >Observation Levels documentation</a>. "
        required: false
        schema:
          type: string
      - name: observationUnitLevelRelationshipCode
        in: query
        description: "The Observation Unit Level Code. \n<br/>This parameter should\
          \ be used together with `observationUnitLevelName` or `observationUnitLevelOrder`.\
          \ References ObservationUnit->observationUnitPosition->observationLevel->levelCode\
          \ \n<br/>For more information on Observation Levels, please review the <a\
          \ target=\"_blank\" href=\"https://wiki.brapi.org/index.php/Observation_Levels\"\
          >Observation Levels documentation</a>. "
        required: false
        schema:
          type: string
      - name: observationUnitLevelRelationshipDbId
        in: query
        description: "The observationUnitDbId associated with a particular level and\
          \ code.\n<br/>This parameter should be used together with `observationUnitLevelName`\
          \ or `observationUnitLevelOrder`. References ObservationUnit->observationUnitPosition->observationLevel->observationUnitDbId\
          \ \n<br/>For more information on Observation Levels, please review the <a\
          \ target=\"_blank\" href=\"https://wiki.brapi.org/index.php/Observation_Levels\"\
          >Observation Levels documentation</a>. "
        required: false
        schema:
          type: string
      - name: observationTimeStampRangeEnd
        in: query
        description: Timestamp range end
        required: false
        schema:
          type: string
          format: date-time
      - name: observationTimeStampRangeStart
        in: query
        description: Timestamp range start
        required: false
        schema:
          type: string
          format: date-time
      - name: seasonDbId
        in: query
        description: "The year or Phenotyping campaign of a multi-annual study (trees,\
          \ grape, ...)"
        required: false
        schema:
          type: string
      - $ref: "#/components/parameters/externalReferenceId"
      - $ref: "#/components/parameters/externalReferenceID"
      - $ref: "#/components/parameters/externalReferenceSource"
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/pageSize"
      - $ref: "#/components/parameters/authorizationHeader"
      responses:
        "200":
          $ref: "#/components/responses/ObservationListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
    put:
      tags:
      - Observations
      summary: Update the details for an existing Observation
      description: Update the details for an existing Observation
      parameters:
      - $ref: "#/components/parameters/authorizationHeader"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/ObservationNewRequest"
              example: "{<observationDbId>_1={additionalInfo={}, collector=1835c514,\
                \ externalReferences=[{}], geoCoordinates={}, germplasm={}, observationDbId=5cbd4c1c,\
                \ observationTimeStamp=2020-08-12T18:10:40.413Z, observationUnit={},\
                \ observationVariable={}, season={}, study={}, uploadedBy=3fc74c0a,\
                \ value=4ee59cb0, images=[{}]}, <observationDbId>_2={additionalInfo={},\
                \ collector=1835c515, externalReferences=[{}], geoCoordinates={},\
                \ germplasm={}, observationDbId=5cbd4c1d, observationTimeStamp=2020-08-12T18:10:40.413Z,\
                \ observationUnit={}, observationVariable={}, season={}, study={},\
                \ uploadedBy=3fc74c0b, value=4ee59cb1, images=[{}]}}"
      responses:
        "200":
          $ref: "#/components/responses/ObservationListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
    post:
      tags:
      - Observations
      summary: Create new Observation
      description: Add new Observation to database
      parameters:
      - $ref: "#/components/parameters/authorizationHeader"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ObservationNewRequest"
      responses:
        "200":
          $ref: "#/components/responses/ObservationListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
