      properties:
        additionalInfo:
          $ref: "#/components/schemas/AdditionalInfo"
        eventDateRange:
          type: array
          description: "An object describing when a particular Event has taken place.\
            \ An Event can occur at one or more discrete time points (`discreteDates`)\
            \ or an event can happen continuously over a longer period of time (`startDate`,\
            \ `endDate`)"
          nullable: true
          items:
            $ref: "#/components/schemas/EventDateRange"
        eventDbId:
          type: string
          description: Internal database identifier
        eventDescription:
          type: string
          description: "A detailed, human-readable description of this event\n<br/>MIAPPE\
            \ V1.1 (DM-67) Event description - Description of the event, including\
            \ details such as amount applied and possibly duration of the event. "
          nullable: true
        eventParameters:
          type: array
          description: A list of objects describing additional event parameters. Each
            of the following accepts a human-readable value or URI
          nullable: true
          items:
            $ref: "#/components/schemas/EventParameter"
        eventType:
          type: string
          description: |-
            An identifier for this event type, in the form of an ontology class reference
            <br/>ICASA Management events allow for the following types: planting, fertilizer, irrigation, tillage, organic_material, harvest, bed_prep, inorg_mulch, inorg_mul_rem, chemicals, mowing, observation, weeding, puddling, flood_level, other
            <br/>MIAPPE V1.1 (DM-66) Event accession number - Accession number of the event type in a suitable controlled vocabulary (Crop Ontology).
          nullable: true
        eventTypeDbId:
          type: string
          description: |-
            An identifier for this event type, in the form of an ontology class reference
            <br/>ICASA Management events allow for the following types: planting, fertilizer, irrigation, tillage, organic_material, harvest, bed_prep, inorg_mulch, inorg_mul_rem, chemicals, mowing, observation, weeding, puddling, flood_level, other
            <br/>MIAPPE V1.1 (DM-66) Event accession number - Accession number of the event type in a suitable controlled vocabulary (Crop Ontology).
          nullable: true
        studyDbId:
          type: string
        studyName:
          type: string
        studyPUI:
          type: string
      description: "An event is discrete occurrence at a particular time in the experiment.\
        \ Events may be the realization of Treatments or parts of Treatments, or may\
        \ be confounding to Treatments. \n<br> ICASA Management Events allow for the\
        \ following types -> planting, fertilizer, irrigation, tillage, organic_material,\
        \ harvest, bed_prep, inorg_mulch, inorg_mul_rem, chemicals, mowing, observation,\
        \ weeding, puddling, flood_level, other"
    EventDateRange:
      type: object
      properties:
        discreteDates:
          type: array
          description: |-
            A list of dates when the event occurred
            <br/>MIAPPE V1.1 (DM-68) Event date - Date and time of the event.
          nullable: true
          items:
            type: string
            format: date-time
        endDate:
          type: string
          description: |-
            The end of a continuous or regularly repetitive event
            <br/>MIAPPE V1.1 (DM-68) Event date - Date and time of the event.
          format: date-time
          nullable: true
        eventDbId:
          type: string
        startDate:
          type: string
          description: |-
            The beginning of a continuous or regularly repetitive event
            <br/>MIAPPE V1.1 (DM-68) Event date - Date and time of the event.
          format: date-time
          nullable: true
      description: "An object describing when a particular Event has taken place.\
        \ An Event can occur at one or more discrete time points (`discreteDates`)\
        \ or an event can happen continuously over a longer period of time (`startDate`,\
        \ `endDate`)"
    EventParameter:
      type: object
      properties:
        code:
          type: string
          description: |-
            The shortened code name of an event parameter
            <br>ICASA "Code_Display"
          nullable: true
        description:
          type: string
          description: A human readable description of this event parameter. This
            description is usually associated with the 'name' and 'code' of an event
            parameter.
          nullable: true
        eventDbId:
          type: string
        name:
          type: string
          description: |-
            The full name of an event parameter
            <br>ICASA "Variable_Name"
          nullable: true
        units:
          type: string
          description: "The units or data type of the 'value'. \n<br>If the 'value'\
            \ comes from a standardized vocabulary or an encoded list of values, then\
            \ 'unit' should be 'code'. \n<br>If the 'value' IS NOT a number, then\
            \ 'unit' should specify a data type eg. 'text', 'boolean', 'date', etc.\
            \ \n<br>If the value IS a number, then 'unit' should specify the units\
            \ used eg. 'ml', 'cm', etc\n<br>ICASA \"Unit_or_type\""
          nullable: true
        value:
          type: string
          description: The single value of this event parameter. This single value
            is accurate for all the dates in the date range. If 'value' is populated
            then 'valuesByDate' should NOT be populated.
          nullable: true
        valueDescription:
          type: string
          description: "If the event parameter 'unit' field is 'code', then use 'valueDescription'\
            \ to add a human readable description to the value."
          nullable: true
        valuesByDate:
          type: array
          description: An array of values corresponding to each timestamp in the 'discreteDates'
            array of this event. The 'valuesByDate' array should exactly match the
            size of the 'discreteDates' array. If 'valuesByDate' is populated then
            'value' should NOT be populated.
          nullable: true
          items:
            type: string
      description: "Additional metadata to describe an event, based on the ICASA standard\
        \ model. For example, 'Tillage Implement' (tiimp), 'Tillage Depth' (tidep),\
        \ and 'Tillage Mix Effectiveness' (timix) might all be recorded parameters\
        \ for a Tillage event."
