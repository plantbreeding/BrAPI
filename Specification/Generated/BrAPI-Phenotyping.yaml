          items:
            $ref: "#/components/schemas/ExternalReference"
        ontologyReference:
          $ref: "#/components/schemas/OntologyReference"
        scaleName:
          type: string
          description: |-
            Name of the scale
            <br/>MIAPPE V1.1 (DM-92) Scale Name of the scale associated with the variable
        scalePUI:
          type: string
          description: "The Permanent Unique Identifier of a Scale, usually in the\
            \ form of a URI"
          nullable: true
        units:
          type: string
          description: "This field can be used to describe the units used for this\
            \ scale. This should be the abbreviated \nform of the units, intended\
