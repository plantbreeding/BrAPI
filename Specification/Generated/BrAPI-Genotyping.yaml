      - $ref: "#/components/schemas/ReferenceSetNewRequest"
      - required:
        - referenceSetDbId
        type: object
        properties:
          referenceSetDbId:
            type: string
            description: The unique identifier for a ReferenceSet
        description: "A `ReferenceSet` is a set of `Reference` s which typically comprise\
          \ a reference assembly, such as `GRCH_38`. A `ReferenceSet` defines a common\
          \ coordinate space for comparing reference-aligned experimental data."
    ReferenceSetNewRequest:
      required:
      - referenceSetName
      type: object
      properties:
        additionalInfo:
          $ref: "#/components/schemas/AdditionalInfo"
        assemblyPUI:
          type: string
          description: "The remaining information is about the source of the sequences\
            \ Public id of this reference set, such as `GRCH_37`."
          nullable: true
        commonCropName:
          type: string
          description: Common name for the crop
          nullable: true
        description:
          type: string
          description: Optional free text description of this reference set.
          nullable: true
        externalReferences:
          type: array
          description: An array of external reference ids. These are references to
            this piece of data in an external system. Could be a simple string or
            a URI.
          nullable: true
          items:
            $ref: "#/components/schemas/ExternalReference"
        isDerived:
          type: boolean
          description: "A reference set may be derived from a source if it contains\
            \ additional sequences, or some of the sequences within it are derived\
            \ (see the definition of `isDerived` in `Reference`)."
          nullable: true
        md5checksum:
          type: string
          description: |-
            Order-independent MD5 checksum which identifies this `ReferenceSet`.

            To compute this checksum, make a list of `Reference.md5checksum` for all
            `Reference` s in this set. Then sort that list, and take the MD5 hash of
            all the strings concatenated together. Express the hash as a lower-case
            hexadecimal string.
          nullable: true
        referenceDbId:
          type: string
        referenceName:
          type: string
        referenceSetName:
          type: string
          description: The human readable name of a ReferenceSet
        sourceAccessions:
          type: array
          description: "All known corresponding accession IDs in INSDC (GenBank/ENA/DDBJ)\
            \ ideally with a version number, e.g. `NC_000001.11`."
          nullable: true
          items:
            type: string
        sourceGermplasmDbIds:
          type: array
          description: All known corresponding Germplasm
          nullable: true
          items:
            type: string
        sourceURI:
          type: string
          description: Specifies a FASTA format file/string.
          nullable: true
        species:
          $ref: "#/components/schemas/OntologyTerm"
        variantDbIds:
          type: array
          description: variants
          nullable: true
          items:
            type: string
        variantSetDbIds:
          type: array
          description: variantSets
          nullable: true
          items:
            type: string
      description: "A `ReferenceSet` is a set of `Reference` s which typically comprise\
        \ a reference assembly, such as `GRCH_38`. A `ReferenceSet` defines a common\
        \ coordinate space for comparing reference-aligned experimental data."
    ReferenceSetRequest:
      type: object
