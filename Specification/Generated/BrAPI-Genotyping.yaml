components:
  schemas:
    AdditionalInfo:
      type: string
      additionalProperties:
        description: A free space containing any additional information related to
          a particular object.
      description: "A free space containing any additional information related to\
        \ a particular object. A data source may provide any JSON object, unrestricted\
        \ by the BrAPI specification."
      nullable: true
    AlleleMatrix:
      type: object
      properties:
        dataMatrices:
          type: array
          description: "The 'dataMatrices' are an array of matrix objects that hold\
            \ the allele data and associated metadata. Each matrix should be the same\
            \ size and orientation, aligned with the \"callSetDbIds\" as columns and\
            \ the \"variantDbIds\" as rows."
          nullable: true
          items:
            $ref: "#/components/schemas/DataMatrix"
        expandHomozygotes:
          type: boolean
          description: Should homozygotes be expanded (true) or collapsed into a single
            occurrence (false)
          nullable: true
        pagination:
          type: array
          description: Pagination for the matrix
          nullable: true
          items:
            $ref: "#/components/schemas/Pagination"
        sepPhased:
          type: string
          description: The string used as a separator for phased allele calls.
          nullable: true
        sepUnphased:
          type: string
          description: The string used as a separator for unphased allele calls.
          nullable: true
        unknownString:
          type: string
          description: The string used as a representation for missing data.
          nullable: true
      description: "The AlleleMatrix object is used to describe a matrix of genotyping\
        \ results. This 2d array of data reduces the overall size of the response\
        \ for larger datasets, when compared to the Calls endpoints. This makes genotype\
        \ data retrieval faster and easier."
    AlleleMatrixPagination:
      type: object
      properties:
        dimension:
          type: string
          description: the dimension of the matrix being paginated
          example: VARIANTS
          enum:
          - CALLSETS
          - VARIANTS
        page:
          type: integer
          description: the requested page number (zero indexed)
          format: int32
          example: 0
        pageSize:
          type: integer
          description: the maximum number of elements per page in this dimension of
            the matrix
          format: int32
          example: 500
    AlleleMatrixRequest:
      type: object
      properties:
        callSetDbIds:
          type: array
          description: A list of IDs which uniquely identify `CallSets` within the
            given database server
          items:
            type: string
        dataMatrixAbbreviations:
          type: array
          description: "`dataMatrixAbbreviations` is a comma seperated list of abbreviations\
            \ (ie 'GT', 'RD' etc). This list controls which data matrices are returned\
            \ in the response."
          nullable: true
          items:
            type: string
        dataMatrixNames:
