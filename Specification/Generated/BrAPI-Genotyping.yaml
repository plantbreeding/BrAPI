                \ <sampleDbId>_2={additionalInfo={}, callSets=[{}], column=20, externalReferences=[{}],\
                \ germplasm={}, observationUnit={}, plate={}, program={}, row=00358168,\
                \ sampleBarcode=6a6db74c, sampleDescription=33889650, sampleDbId=079d6d5f,\
                \ sampleGroupId=70fcb312, sampleName=082a6b4d, samplePUI=08863648,\
                \ sampleTimestamp=2020-08-12T18:10:40.413Z, sampleType=0889ec7e, study={},\
                \ takenBy=599da044, tissueType=4d105e23, trial={}, well=06bc78f4}}"
      responses:
        "200":
          $ref: "#/components/responses/SampleListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
    post:
      tags:
      - Samples
      summary: Create new Sample
      description: Add new Sample to database
      parameters:
      - $ref: "#/components/parameters/authorizationHeader"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SampleNewRequest"
      responses:
        "200":
          $ref: "#/components/responses/SampleListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
