    Variant:
      required:
      - variantDbId
      type: object
      properties:
        additionalInfo:
          $ref: "#/components/schemas/AdditionalInfo"
        analysis:
          type: array
          description: Set of Analysis descriptors for this VariantSet
          nullable: true
          items:
            type: string
        ciend:
          type: array
          description: "Similar to \"cipos\", but for the variant's end position (which\
            \ is derived from start + svlen)."
          nullable: true
          items:
            type: integer
            format: int32
        cipos:
          type: array
          description: |-
            In the case of structural variants, start and end of the variant may not
            be known with an exact base position. "cipos" provides an interval with
            high confidence for the start position. The interval is provided by 0 or
            2 signed integers which are added to the start position.
            Based on the use in VCF v4.2
          nullable: true
          items:
            type: integer
            format: int32
        created:
          type: string
          description: The timestamp when this variant was created.
          format: date-time
          nullable: true
        end:
          type: integer
          description: "This field is optional and may be ignored if there is no relevant\
            \ map or reference to be associated with.\n<br>The end position (exclusive),\
            \ resulting in [start, end) closed-open interval. This is typically calculated\
            \ \nby `start + referenceBases.length`."
          format: int32
          nullable: true
        externalReferences:
          type: array
          description: An array of external reference ids. These are references to
            this piece of data in an external system. Could be a simple string or
            a URI.
          nullable: true
          items:
            $ref: "#/components/schemas/ExternalReference"
        filtersApplied:
          type: boolean
          description: True if filters were applied for this variant. VCF column 7
            "FILTER" any value other than the missing value.
          nullable: true
        filtersFailed:
          type: array
          description: Zero or more filters that failed for this variant. VCF column
            7 "FILTER" shared across all alleles in the same VCF record.
          nullable: true
          items:
            type: string
        filtersPassed:
          type: boolean
          description: True if all filters for this variant passed. VCF column 7 "FILTER"
            value PASS.
          nullable: true
        referenceBases:
          type: string
          description: The reference bases for this variant. They start at the given
            start position.
          nullable: true
