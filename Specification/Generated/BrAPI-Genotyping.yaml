          type: string
        referenceSetName:
          type: string
        start:
          type: integer
          description: "This field is optional and may be ignored if there is no relevant\
            \ map or reference to be associated with.\n<br> The start position at\
            \ which this variant occurs (0-based). This corresponds to the first base\
            \ of the string \nof reference bases. Genomic positions are non-negative\
            \ integers less than reference length. Variants spanning \nthe join of\
            \ circular genomes are represented as two variants one on each side of\
            \ the join (position 0)."
          format: int32
          nullable: true
        svlen:
          type: integer
          description: Length of the - if labeled as such in variant_type - structural
            variation. Based on the use in VCF v4.2
          format: int32
          nullable: true
        updated:
          type: string
          description: The time at which this variant was last updated.
          format: date-time
          nullable: true
        variantDbId:
          type: string
          description: The ID which uniquely identifies a `Variant`
