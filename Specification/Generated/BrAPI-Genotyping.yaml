        \ search. <br/> \nReview the <a target=\"_blank\" href=\"https://wiki.brapi.org/index.php/Search_Services#POST_Search_Entity\"\
        >Search Services documentation</a> for additional implementation details."
      description: "Get the results of a `Variant` search request <br/>\nClients should\
        \ submit a search request using the corresponding `POST /search/variant` endpoint.\n\
        Search requests allow a client to send a complex query for data. However,\
        \ the server may not respond with the search results immediately. \nIf a server\
        \ needs more time to process the request, it might respond with a `searchResultsDbId`.\
        \ \nUse this endpoint to retrieve the results of the search. <br/> \nReview\
        \ the <a target=\"_blank\" href=\"https://wiki.brapi.org/index.php/Search_Services#POST_Search_Entity\"\
        >Search Services documentation</a> for additional implementation details."
      responses:
        "200":
          $ref: "#/components/responses/VariantListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
  /search/variantsets/{searchResultsDbId}:
    get:
      tags:
      - VariantSets
      summary: "Submit a search request for `VariantSet`<br/>\nSearch requests allow\
        \ a client to send a complex query for data. However, the server may not respond\
        \ with the search results immediately. \nIf a server needs more time to process\
        \ the request, it might respond with a `searchResultsDbId`. \nUse the corresponding\
        \ `GET /search/variantSet/{searchResultsDbId}` to retrieve the results of\
        \ the search. <br/> \nReview the <a target=\"_blank\" href=\"https://wiki.brapi.org/index.php/Search_Services#POST_Search_Entity\"\
        >Search Services documentation</a> for additional implementation details."
      description: "Get the results of a `VariantSet` search request <br/>\nClients\
        \ should submit a search request using the corresponding `POST /search/variantSet`\
        \ endpoint.\nSearch requests allow a client to send a complex query for data.\
        \ However, the server may not respond with the search results immediately.\
        \ \nIf a server needs more time to process the request, it might respond with\
        \ a `searchResultsDbId`. \nUse this endpoint to retrieve the results of the\
        \ search. <br/> \nReview the <a target=\"_blank\" href=\"https://wiki.brapi.org/index.php/Search_Services#POST_Search_Entity\"\
        >Search Services documentation</a> for additional implementation details."
      responses:
        "200":
          $ref: "#/components/responses/VariantSetListResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
components:
  schemas:
    AdditionalInfo:
      type: object
      properties:
        additionalProperties:
          type: string
      description: "A free space containing any additional information related to\
        \ a particular object. A data source may provide any JSON object, unrestricted\
        \ by the BrAPI specification."
    AlleleMatrix:
      required:
      - callSetDbIds
      - variantSetDbIds
      type: object
      properties:
        callSetDbIds:
          type: array
          items:
            type: string
        expandHomozygotes:
          type: boolean
        sepPhased:
          type: string
        sepUnphased:
          type: string
        unknownString:
          type: string
        variantDbIds:
          type: array
          items:
            type: string
        variantSetDbIds:
          type: array
          items:
            type: string
      description: "The AlleleMatrix object is used to describe a matrix of genotyping\
        \ results. This 2d array of data reduces the overall size of the response\
        \ for larger datasets, when compared to the Calls endpoints. This makes genotype\
        \ data retrieval faster and easier."
    AlleleMatrixSearchRequest:
      type: object
      properties:
        expandHomozygotes:
          type: boolean
        preview:
          type: boolean
        sepPhased:
          type: string
        sepUnphased:
          type: string
        unknownString:
          type: string
      description: "The AlleleMatrix object is used to describe a matrix of genotyping\
        \ results. This 2d array of data reduces the overall size of the response\
        \ for larger datasets, when compared to the Calls endpoints. This makes genotype\
        \ data retrieval faster and easier."
    Analysis:
      required:
      - analysisDbId
      type: object
      properties:
        analysisDbId:
          type: string
        analysisName:
          type: string
        created:
          type: string
        description:
          type: string
        software:
          type: array
          items:
            type: string
        type:
          type: string
        updated:
          type: string
        variantSetDbId:
          type: string
        variantSetName:
          type: string
      description: "An analysis contains an interpretation of one or several experiments.\
        \ (e.g. SNVs, copy number variations, methylation status) together with information\
        \ about the methodology used."
    Attribute:
      required:
      - attributeName
      - method
      - scale
      - trait
      type: object
      properties:
        additionalInfo:
          $ref: "#/components/schemas/AdditionalInfo"
        attributeCategory:
          type: string
        attributeDbId:
          type: string
        attributeDescription:
          type: string
        attributeName:
          type: string
        attributePUI:
          type: string
        commonCropName:
          type: string
        contextOfUse:
          type: array
          items:
            type: string
        defaultValue:
          type: string
        documentationURL:
          type: string
        growthStage:
          type: string
        institution:
          type: string
        language:
          type: string
        method:
          $ref: "#/components/schemas/Method"
        ontologyReference:
          $ref: "#/components/schemas/OntologyReference"
        scale:
          $ref: "#/components/schemas/Scale"
        scientist:
          type: string
        status:
          type: string
        submissionTimestamp:
          type: string
        synonyms:
          type: array
          items:
            type: string
        trait:
          $ref: "#/components/schemas/Trait"
    AvailableFormat:
      type: object
      properties:
        dataFormat:
          type: string
          description: "dataFormat defines the structure of the data within a file\
            \ (ie DartSeq, VCF, Hapmap, tabular, etc)"
          enum:
          - DartSeq
          - VCF
          - Hapmap
          - tabular
          - JSON
        expandHomozygotes:
          type: boolean
        fileFormat:
          type: string
          description: "fileFormat defines the MIME type of the file (ie text/csv,\
            \ application/excel, application/zip). This should also be reflected in\
            \ the Accept and ContentType HTTP headers for every relevant request and\
            \ response."
          enum:
          - text/csv
          - text/tsv
          - application/excel
          - application/zip
          - application/json
        fileURL:
          type: string
        sepPhased:
          type: string
        sepUnphased:
          type: string
        unknownString:
          type: string
        variantSetDbId:
          type: string
        variantSetName:
          type: string
      description: Each 'availableFormat' object is a pairing of dataFormat and fileFormat.
        These must be communicated in pairs because they are not independent parameters
        and sometimes one influences the other.
    Call:
      required:
      - callSetDbId
      - variantDbId
      - variantSetDbId
      type: object
      properties:
        additionalInfo:
          $ref: "#/components/schemas/AdditionalInfo"
        callSetDbId:
          type: string
        callSetName:
          type: string
        genotypeValue:
          type: string
        phaseSet:
          type: string
        variantDbId:
          type: string
        variantSetDbId:
          type: string
        variantSetName:
          type: string
      description: "A `Call` represents the determination of genotype with respect\
        \ to a particular `Variant`. \n\nIt may include associated information such\
        \ as quality and phasing. For example, a call might assign a probability of\
        \ 0.32 to the occurrence of a SNP named RS_1234 in a call set with the name\
        \ NA_12345."
    CallSearchRequest:
      type: object
      properties:
        expandHomozygotes:
          type: boolean
        sepPhased:
          type: string
        sepUnphased:
          type: string
        unknownString:
          type: string
      description: "A `Call` represents the determination of genotype with respect\
        \ to a particular `Variant`. \n\nIt may include associated information such\
        \ as quality and phasing. For example, a call might assign a probability of\
        \ 0.32 to the occurrence of a SNP named RS_1234 in a call set with the name\
        \ NA_12345."
    CallSet:
      required:
      - callSetDbId
      type: object
      properties:
        additionalInfo:
          $ref: "#/components/schemas/AdditionalInfo"
        callSetDbId:
          type: string
        callSetName:
          type: string
        created:
          type: string
        sampleDbId:
          type: string
        sampleName:
          type: string
        samplePUI:
          type: string
        studyDbId:
          type: string
        studyName:
          type: string
        studyPUI:
          type: string
        updated:
          type: string
        variantSetDbIds:
          type: array
          items:
            type: string
      description: A CallSet is a collection of Calls that were generated by the same
        analysis of the same Sample
    CallSetSearchRequest:
      type: object
      properties: {}
      description: A CallSet is a collection of Calls that were generated by the same
        analysis of the same Sample
    Contact:
      required:
      - contactDbId
      type: object
      properties:
        contactDbId:
          type: string
        email:
          type: string
        instituteName:
          type: string
        name:
          type: string
        orcid:
          type: string
        type:
          type: string
      description: A persons contact information
    ContentTypes:
      type: string
      enum:
      - application/json
      - text/csv
      - text/tsv
      - application/flapjack
    Context:
      title: context
      type: array
      description: "The JSON-LD Context is used to provide JSON-LD definitions to\
        \ each field in a JSON object. By providing an array of context file urls,\
        \ a BrAPI response object becomes JSON-LD compatible.  \n\nFor more information,\
        \ see https://w3c.github.io/json-ld-syntax/#the-context"
      example:
      - https://brapi.org/jsonld/context/metadata.jsonld
      items:
        type: string
        format: uri
    CrossParent:
      type: object
      properties:
        germplasm:
          $ref: "#/components/schemas/Germplasm"
        observationUnitDbId:
          type: string
        observationUnitName:
          type: string
        observationUnitPUI:
          type: string
        parentType:
          $ref: "#/components/schemas/ParentType"
      description: The identifying information gor the parent material of a cross.
    CrossType:
      type: string
      description: "The type of cross make. Accepted values for this field are 'BIPARENTAL',\
        \ 'SELF', 'OPEN_POLLINATED', 'BULK',  'BULK_SELFED',  'BULK_OPEN_POLLINATED'\
        \ and 'DOUBLE_HAPLOID'."
      enum:
      - BIPARENTAL
      - SELF
      - OPEN_POLLINATED
      - BULK
      - BULK_SELFED
      - BULK_OPEN_POLLINATED
      - DOUBLE_HAPLOID
    DataMatrix:
      type: object
      properties:
        alleleMatrix:
          $ref: "#/components/schemas/AlleleMatrix"
        dataMatrix:
          type: array
          items:
            type: array
            items:
              type: string
        dataMatrixAbbreviation:
          type: string
        dataMatrixName:
          type: string
        dataType:
          type: string
          description: The type of field represented in this data matrix. This is
            intended to help parse the data out of JSON.
          enum:
          - string
          - integer
          - float
          - boolean
      description: "A two dimensional array that holds allele data or associated metadata.\
        \ Each matrix should be the same size and orientation, aligned with the \"\
        callSetDbIds\" as columns and the \"variantDbIds\" as rows."
    ExperimentFactor:
      type: object
      properties:
        factor:
          type: string
        factorPUI:
          type: string
        modalities:
          type: array
          items:
            type: object
            properties:
              modality:
                type: string
              modalityPUI:
                type: string
    ExternalReference:
      type: object
      properties:
        referenceId:
          type: string
        referenceSource:
          type: string
    GenomeMap:
      required:
      - commonCropName
      - mapDbId
      - type
      type: object
      properties:
        additionalInfo:
          $ref: "#/components/schemas/AdditionalInfo"
        comments:
          type: string
        commonCropName:
          type: string
        documentationURL:
          type: string
        linkageGroupCount:
          type: integer
          format: int32
        mapDbId:
          type: string
        mapName:
          type: string
        mapPUI:
          type: string
        markerCount:
          type: integer
          format: int32
        publishedDate:
          type: string
        scientificName:
          type: string
        type:
          type: string
        unit:
          type: string
      description: The GenomeMap represents the metadata associated with a reference
        map of a particular species genome. A GenomeMap can either represent a physical
        map or genetic map.
    GenotypeMetadata:
      type: object
      properties:
        call:
          $ref: "#/components/schemas/Call"
        dataType:
          type: string
          description: The type of field represented in this Genotype Field. This
            is intended to help parse the data out of JSON.
          enum:
          - string
          - integer
          - float
          - boolean
        fieldAbbreviation:
          type: string
        fieldName:
          type: string
        fieldValue:
          type: string
      description: Genotype Metadata are additional layers of metadata associated
        with each genotype.
    GeoJSON:
      type: object
      properties:
        geometry:
          $ref: "#/components/schemas/GeoJSONGeometry"
        type:
          type: string
      description: |-
        One geometry as defined by GeoJSON (RFC 7946). All coordinates are decimal values on the WGS84 geographic coordinate reference system.

        Copied from RFC 7946 Section 3.1.1

        A position is an array of numbers. There MUST be two or more elements. The first two elements are longitude and latitude, or
        easting and northing, precisely in that order and using decimal numbers. Altitude or elevation MAY be included as an optional third element.
    GeoJSONGeometry:
      oneOf:
      - required:
        - coordinateDbIds
        - type
        type: object
        properties:
          coordinates:
            type: array
            items:
              type: number
          type:
            type: string
        description: |-
          Copied from RFC 7946 Section 3.1.1

          A position is an array of numbers. There MUST be two or more elements. The first two elements are longitude and latitude, or
          easting and northing, precisely in that order and using decimal numbers. Altitude or elevation MAY be included as an optional third element.
      - required:
        - coordinateDbIds
        - type
        type: object
        properties:
          coordinates:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: number
          type:
            type: string
        description: "An array of Linear Rings. Each Linear Ring is an array of Points.\
          \ \n\nA Point is an array of numbers. There MUST be two or more elements.\
          \ The first two elements are longitude and latitude, or\neasting and northing,\
          \ precisely in that order and using decimal numbers. Altitude or elevation\
          \ MAY be included as an optional third element."
    GeoJSONSearchArea:
      type: object
      properties:
        geometry:
          $ref: "#/components/schemas/GeoJSONGeometry"
        germplasmOrigin:
          $ref: "#/components/schemas/GermplasmOrigin"
        imageDbId:
          type: string
        imageName:
          type: string
        observationDbId:
          type: string
        observationUnit:
          $ref: "#/components/schemas/ObservationUnitPosition"
        type:
          type: string
    Germplasm:
      required:
      - commonCropName
      - germplasmDbId
      - germplasmName
      - germplasmPUI
      type: object
      properties:
        accessionNumber:
          type: string
        acquisitionDate:
          type: string
        additionalInfo:
          $ref: "#/components/schemas/AdditionalInfo"
        biologicalStatusOfAccessionCode:
          type: string
          description: "MCPD (v2.1) (SAMPSTAT) 19. The coding scheme proposed can\
            \ be used at 3 different levels of detail: either by using the general\
            \ codes such as 100, 200, 300, 400, or by using the more specific codes\
            \ such as 110, 120, etc. \n\n100) Wild \n110) Natural \n120) Semi-natural/wild\
            \ \n130) Semi-natural/sown \n200) Weedy \n300) Traditional cultivar/landrace\
            \ \n400) Breeding/research material \n410) Breeders line \n411) Synthetic\
            \ population \n412) Hybrid \n413) Founder stock/base population \n414)\
            \ Inbred line (parent of hybrid cultivar) \n415) Segregating population\
            \ \n416) Clonal selection \n420) Genetic stock \n421) Mutant (e.g. induced/insertion\
            \ mutants, tilling populations) \n422) Cytogenetic stocks (e.g. chromosome\
            \ addition/substitution, aneuploids,  amphiploids) \n423) Other genetic\
            \ stocks (e.g. mapping populations) \n500) Advanced or improved cultivar\
            \ (conventional breeding methods) \n600) GMO (by genetic engineering)\
            \ \n999) Other (Elaborate in REMARKS field)"
          enum:
          - "100"
          - "110"
          - "120"
          - "130"
          - "200"
          - "300"
          - "400"
          - "410"
          - "411"
          - "412"
          - "413"
          - "414"
          - "415"
          - "416"
          - "420"
          - "421"
          - "422"
          - "423"
          - "500"
          - "600"
          - "999"
        biologicalStatusOfAccessionDescription:
          type: string
        breedingMethodDbId:
          type: string
        breedingMethodName:
          type: string
        collection:
          type: string
        commonCropName:
          type: string
        countryOfOriginCode:
          type: string
        defaultDisplayName:
          type: string
        documentationURL:
          type: string
        genus:
          type: string
        germplasmDbId:
          type: string
        germplasmName:
          type: string
        germplasmPUI:
          type: string
        germplasmPreprocessing:
          type: string
        instituteCode:
          type: string
        instituteName:
          type: string
        pedigree:
          type: string
        sampleDbIds:
          type: array
          items:
            type: string
        seedSource:
          type: string
        seedSourceDescription:
          type: string
        species:
          type: string
        speciesAuthority:
          type: string
        subtaxa:
          type: string
        subtaxaAuthority:
          type: string
      description: "The conceptual identifiers and metadata describing a genetically\
        \ unique organism that is noteworthy in some way. Depending on context, a\
        \ Germplasm might be synonymous with Accession, Line, or Genotype. Note that\
        \ Germplasm is conceptual data, not necessarily associated to a real physical\
        \ object, so Seed/Inventory Lots and Observation Units become physical instantiations\
        \ of a particular Germplasm. Note a Germplasm is unique and noteworthy, so\
        \ a Cross may or may not create a new Germplasm, since not every Cross is\
        \ unique or noteworthy."
    GermplasmOrigin:
      type: object
      properties:
        coordinateUncertainty:
          type: string
        germplasmDbId:
          type: string
        germplasmName:
          type: string
        germplasmPUI:
          type: string
      description: "Information for material (orchard, natural sites, ...). Geographic\
        \ identification of the plants from which seeds or cutting have been taken\
        \ to produce that germplasm."
    GrowthFacility:
      type: object
      properties:
        PUI:
          type: string
        description:
          type: string
        studyDbId:
          type: string
        studyName:
          type: string
        studyPUI:
          type: string
      description: Short description of the facility in which the study was carried
        out.
    ListType:
      type: string
      description: The type of objects that are referenced in a List
      enum:
      - germplasm
      - markers
      - variants
      - programs
      - trials
      - studies
      - observationUnits
      - observations
      - observationVariables
      - samples
    MarkerPosition:
      type: object
      properties:
        additionalInfo:
          $ref: "#/components/schemas/AdditionalInfo"
        linkageGroupName:
          type: string
        mapDbId:
          type: string
        mapName:
          type: string
        mapPUI:
          type: string
        position:
          type: integer
          format: int32
        variantDbId:
          type: string
      description: A MarkerPosition describes a particular genetic marker at a specific
        position on a GenomeMap. A collection of MarkerPositions make up the data
        to represent a full GenomeMap.
    MarkerPositionSearchRequest:
      type: object
      properties:
        maxPosition:
          type: integer
          format: int32
        minPosition:
          type: integer
          format: int32
      description: A MarkerPosition describes a particular genetic marker at a specific
        position on a GenomeMap. A collection of MarkerPositions make up the data
        to represent a full GenomeMap.
    MetadataField:
      type: object
      properties:
        dataType:
          type: string
          description: The type of field represented in this Genotype Field. This
            is intended to help parse the data out of JSON.
          enum:
          - string
          - integer
          - float
          - boolean
        fieldAbbreviation:
          type: string
        fieldName:
          type: string
        variantSetDbId:
          type: string
        variantSetName:
          type: string
      description: "Indicates which types of genotyping data and metadata are available\
        \ in the VariantSet. \n<br> When possible, these field names and abbreviations\
        \ should follow the VCF standard "
    Method:
      required:
      - methodName
      type: object
      properties:
        additionalInfo:
          $ref: "#/components/schemas/AdditionalInfo"
        bibliographicalReference:
          type: string
        description:
          type: string
        formula:
          type: string
        methodClass:
          type: string
        methodDbId:
          type: string
        methodName:
          type: string
        methodPUI:
          type: string
        ontologyReferenceDbId:
          type: string
      description: "A description of the way an Observation should be collected. \n\
        <br>For example, an ObservationVariable might be defined with a Trait of \"\
        plant height\", a Scale of \"meters\", and a Method of \"tape measure\". This\
        \ variable would be distinct from a variable with the Method \"estimation\"\
        \ or \"drone image processing\". "
    ObservationUnitHierarchyLevel:
      type: object
      properties:
        levelName:
          type: string
        levelOrder:
          type: integer
          format: int32
      description: "The exact level and level code of an observation unit. \n\nFor\
        \ more information on Observation Levels, please review the <a target=\"_blank\"\
        \ href=\"https://wiki.brapi.org/index.php/Observation_Levels\">Observation\
        \ Levels documentation</a>. \n\nMIAPPE V1.1 DM-71 Observation unit type \"\
        Type of observation unit in textual form, usually one of the following: study,\
        \ block, sub-block, plot, sub-plot, pot, plant. Use of other observation unit\
        \ types is possible but not recommended. \nThe observation unit type can not\
        \ be used to indicate sub-plant levels. However, observations can still be\
        \ made on the sub-plant level, as long as the details are indicated in the\
        \ associated observed variable (see observed variables). \nAlternatively,\
        \ it is possible to use samples for more detailed tracing of sub-plant units,\
        \ attaching the observations to them instead.\" "
    ObservationUnitLevel:
      type: object
      properties:
        levelCode:
          type: string
        levelName:
          type: string
        levelOrder:
          type: integer
          format: int32
      description: "The exact level and level code of an observation unit. \n\nFor\
        \ more information on Observation Levels, please review the <a target=\"_blank\"\
        \ href=\"https://wiki.brapi.org/index.php/Observation_Levels\">Observation\
        \ Levels documentation</a>. \n\nMIAPPE V1.1 DM-71 Observation unit type \"\
        Type of observation unit in textual form, usually one of the following: study,\
        \ block, sub-block, plot, sub-plot, pot, plant. Use of other observation unit\
        \ types is possible but not recommended. \nThe observation unit type can not\
        \ be used to indicate sub-plant levels. However, observations can still be\
        \ made on the sub-plant level, as long as the details are indicated in the\
        \ associated observed variable (see observed variables). \nAlternatively,\
        \ it is possible to use samples for more detailed tracing of sub-plant units,\
        \ attaching the observations to them instead.\" "
    ObservationUnitPosition:
      type: object
      properties:
        entryType:
          type: string
          description: "The type of entry for this observation unit. ex. \"CHECK\"\
            , \"TEST\", \"FILLER\""
          enum:
          - CHECK
          - TEST
          - FILLER
        observationLevel:
          $ref: "#/components/schemas/ObservationUnitLevel"
        observationUnitDbId:
          type: string
        observationUnitName:
          type: string
        observationUnitPUI:
          type: string
        positionCoordinateX:
          type: string
        positionCoordinateXType:
          type: string
          description: "The type of positional coordinate used. Must be one of the\
            \ following values \n\nLONGITUDE - ISO 6709 standard, WGS84 geodetic datum.\
            \ See 'Location Coordinate Encoding' for details \n\nLATITUDE - ISO 6709\
            \ standard, WGS84 geodetic datum. See 'Location Coordinate Encoding' for\
            \ details \n\nPLANTED_ROW - The physical planted row number \n\nPLANTED_INDIVIDUAL\
            \ - The physical counted number, could be independent or within a planted\
            \ row \n\nGRID_ROW - The row index number of a square grid overlay \n\n\
            GRID_COL - The column index number of a square grid overlay \n\nMEASURED_ROW\
