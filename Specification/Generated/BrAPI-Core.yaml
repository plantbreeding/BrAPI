      properties:
        message:
          type: string
          description: A short message concerning the status of this request/response
          example: "Request accepted, response successful"
        messageType:
          type: string
          description: The logging level for the attached message
          example: INFO
          enum:
          - DEBUG
          - ERROR
          - WARNING
          - INFO
      description: An array of status messages to convey technical logging information
        from the server to the client.
    tokenPagination:
      allOf:
      - $ref: "#/components/schemas/basePagination"
      - required:
        - nextPageToken
        type: object
        properties:
          nextPageToken:
            type: string
            description: "**Deprecated in v2.1** Please use `page`. Github issue number\
              \ #451 \n<br>The string token used to query the next page of data."
            example: cb668f63
            deprecated: true
          currentPageToken:
            type: string
            description: "**Deprecated in v2.1** Please use `page`. Github issue number\
              \ #451 \n<br>The string token used to query the current page of data."
            example: 48bc6ac1
            deprecated: true
          prevPageToken:
            type: string
            description: "**Deprecated in v2.1** Please use `page`. Github issue number\
              \ #451 \n<br>The string token used to query the previous page of data."
            example: 9659857e
            deprecated: true
        description: "**Deprecated in v2.1** Please use `page`. Github issue number\
          \ #451 \n<br>The pagination object is applicable only when the payload contains\
          \ a \"data\" key. It describes the pagination of the data contained in the\
          \ \"data\" array, as a way to identify which subset of data is being returned.\
          \ \n<br>Tokenized pages are for large data sets which can not be efficiently\
          \ broken into indexed pages. Use the nextPageToken and prevPageToken to\
          \ construct an additional query and move to the next or previous page respectively.\
          \  "
        example:
          currentPage: 0
          pageSize: 1000
          totalCount: 10
          totalPages: 1
