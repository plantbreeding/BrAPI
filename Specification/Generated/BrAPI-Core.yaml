            \   "
          enum:
          - STANDARD
          - PROJECT
      description: A BrAPI Program represents the high level organization or group
        who is responsible for conducting trials and studies. Things like Breeding
        Programs and Funded Projects are considered BrAPI Programs. A Program can
        contain multiple Trials. A Trial can contain multiple Studies.
    ProgramNewRequest:
      required:
      - programDbId
      - programDbId
      - programName
      type: object
      properties:
        abbreviation:
          type: string
        additionalInfo:
          $ref: "#/components/schemas/AdditionalInfo"
        commonCropName:
          type: string
        documentationURL:
          type: string
        fundingInformation:
          type: string
        objective:
          type: string
        personDbId:
          type: string
        programDbId:
          type: string
        programName:
