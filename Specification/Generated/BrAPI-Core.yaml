        listDescription:
          type: string
        listName:
          type: string
        listOwnerName:
          type: string
        listSize:
          type: integer
          format: int32
        listSource:
          type: string
        listType:
          $ref: "#/components/schemas/ListType"
        personDbId:
          type: string
      description: "A List represents a collection of other BrAPI data objects. Typically\
