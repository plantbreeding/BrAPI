openapi: 3.0.0
info:
  title: BrAPI-Core
  version: "2.1"
servers:
- url: /
paths:
  /serverinfo:
    get:
      tags:
      - Server Info
      summary: Get the list of implemented Calls
      description: "Implementation Notes\n\nHaving a consistent structure for the\
        \ path string of each call is very \nimportant for teams to be able to connect\
        \ and find errors. Read more on Github.\n\nHere are the rules for the path\
        \ of each call that should be returned\n\nEvery word in the call path should\
        \ match the documentation exactly, both in \nspelling and capitalization.\
        \ Note that path strings are all lower case, but \npath parameters are camel\
        \ case.\n\nEach path should start relative to \\\"/\\\" and therefore should\
        \ not include \\\"/\\\"\n\nNo leading or trailing slashes (\\\"/\\\") \n\n\
        Path parameters are wrapped in curly braces (\\\"{}\\\"). The name of the\
        \ path parameter \nshould be spelled exactly as it is specified in the documentation.\n\
        \nExamples \n\nGOOD   \"call\": \"germplasm/{germplasmDbId}/pedigree\" \n\n\
        BAD    \"call\": \"germplasm/{id}/pedigree\"\n\nBAD    \"call\": \"germplasm/{germplasmDBid}/pedigree\"\
        \ \n\nBAD    \"call\": \"brapi/v2/germplasm/{germplasmDbId}/pedigree\" \n\n\
        BAD    \"call\": \"/germplasm/{germplasmDbId}/pedigree/\" \n\nBAD    \"call\"\
        : \"germplasm/<germplasmDbId>/pedigree\""
      parameters:
      - name: contentType
        in: query
        description: Filter the list of endpoints based on the response content type.
        required: false
        style: form
        explode: true
        schema:
          $ref: "#/components/schemas/ContentTypes"
      - name: dataType
        in: query
        description: |-
          **Deprecated in v2.1** Please use `contentType`. Github issue number #443
          <br>The data format supported by the call.
        required: false
        deprecated: true
        style: form
        explode: true
        schema:
          $ref: "#/components/schemas/ContentTypes"
      - $ref: "#/components/parameters/authorizationHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                title: ServerInfoResponse
                required:
                - metadata
                - result
                type: object
                properties:
                  '@context':
                    $ref: "#/components/schemas/Context"
                  metadata:
                    $ref: "#/components/schemas/metadata"
                  result:
                    $ref: "#/components/schemas/ServerInfo"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
  /lists:
    get:
      tags:
      - Lists
      summary: Get a filtered list of List
      description: Get a list of List
      parameters:
      - name: dateCreatedRangeStart
        in: query
        description: Define the beginning for an interval of time and only include
          Lists that are created within this interval.
        required: false
        schema:
          type: string
      - name: dateCreatedRangeEnd
        in: query
        description: Define the end for an interval of time and only include Lists
          that are created within this interval.
        required: false
        schema:
          type: string
      - name: dateModifiedRangeStart
        in: query
        description: Define the beginning for an interval of time and only include
          Lists that are modified within this interval.
        required: false
        schema:
          type: string
      - name: dateModifiedRangeEnd
        in: query
        description: Define the end for an interval of time and only include Lists
          that are modified within this interval.
        required: false
        schema:
          type: string
      - name: listDbId
        in: query
        description: An array of primary database identifiers to identify a set of
          Lists
        required: false
        schema:
          type: string
      - name: listName
        in: query
        description: An array of human readable names to identify a set of Lists
        required: false
        schema:
          type: string
      - name: listOwnerName
        in: query
        description: An array of names for the people or entities who are responsible
          for a set of Lists
        required: false
        schema:
          type: string
      - name: listOwnerPersonDbId
        in: query
        description: An array of primary database identifiers to identify people or
