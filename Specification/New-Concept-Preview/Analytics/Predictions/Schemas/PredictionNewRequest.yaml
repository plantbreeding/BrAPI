info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    PredictionNewRequest:
      type: object
      properties:
        additionalInfo:
          additionalProperties:
            type: string
          description: A free space containing any additional information related to a particular object. A data source may provide any JSON object, unrestricted by the BrAPI specification.  
          type: object
        externalReferences: 
          $ref: '#/components/schemas/ExternalReferences'
        procedureDbId:
          description: The unique identifier for a procedure 
          type: string
          example: a3b45b23
        procedureName:
          description: The human readable identifier for a procedure
          type: string
          example: REMOTE-GWAS
        jobDbId:
          description: The unique identifier of a Job
          type: string
          example: a55efb9c
        jobName:
          description: The human readable name of a running job
          type: string
          example: Bob Robertson First GWAS
        studyDbId:
          description: The unique identifier of a Study
          type: string
          example: 9a5c5efb
        studyName:
          description: The human readable name of a Study
          type: string
          example: BrAPI Wheat - NY 2023
        germplasmDbId:
          description: The unique DbId of the Germplasm associated with this prediction
          type: string
          example: 029d705d
        germplasmName:
          description: The human readable name of the Germplasm associated with this prediction
          type: string
          example: A0000003
        observationVariableDbId:
          description: The unique identifier of a Variable
          type: string
          example: b95efca5
        observationVariableName:
          description: The human readable name of a Variable
          type: string
          example: Plant_Height_cm
        value:
          description: The value of the prediction
          type: string
          example: "1026.4"
        standardError:
          description: The standard error of the prediction value
          type: string
          example: "28.7"
        reliability:
          description: The reliability of the prediction value
          type: string
          example: "0.993"


          


          

