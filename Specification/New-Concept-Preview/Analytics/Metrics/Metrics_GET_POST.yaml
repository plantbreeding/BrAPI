info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths:
  /metrics:
    get:
      summary: Get the analysis metrics available on a server
      description: Get the analysis metrics available on a server
      parameters:
      - description: The unique identifier for a Job
        in: query
        name: jobDbId
        required: false
        schema:
          type: string
      - description: The human readable name of a Job
        in: query
        name: jobName
        required: false
        schema:
          type: string
      - description: The unique identifier for a procedure
        in: query
        name: procedureDbId
        required: false
        schema:
          type: string
      - description: The human readable name of a procedure
        in: query
        name: procedureName
        required: false
        schema:
          type: string
      - description: The unique identifier for a variable
        in: query
        name: variableDbId
        required: false
        schema:
          type: string
      - description: The human readable name of a variable
        in: query
        name: variableName
        required: false
        schema:
          type: string
      - description: The human readable name of a procedure parameter
        in: query
        name: parameterName
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/commonCropName'
      - $ref: '#/components/parameters/programDbId'
      - $ref: '#/components/parameters/studyDbId'
      - $ref: '#/components/parameters/studyName'
      - $ref: '#/components/parameters/externalReferenceId'
      - $ref: '#/components/parameters/externalReferenceSource'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/authorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/MetricListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Metrics
    post:
      summary: Create new Metric records
      description: |-
        Create new Metric records
      parameters:
      - $ref: '#/components/parameters/authorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MetricNewRequest'
      responses:
        '200':
          $ref: '#/components/responses/MetricListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
      tags:
      - Metrics
components:
  responses:
    MetricListResponse:
      content:
        application/json:
          schema:
            title: MetricListResponse
            type: object
            properties:
              '@context':
                $ref: '#/components/schemas/Context'
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                type: object
                properties:
                  data:
                    type: array
                    description: The `data` array is part of the BrAPI standard List Response JSON container. `data` will always contain the primary list of objects being returned by a BrAPI endpoint. `data` is also the only array impacted by the `metadata.pagination` details. When the pagination parameters change, the `data` array will reflect those changes in the JSON response.
                    items:
                      $ref: '#/components/schemas/Metric'
                required:
                - data
            required:
            - metadata
            - result
      description: OK
      headers: {}
      
