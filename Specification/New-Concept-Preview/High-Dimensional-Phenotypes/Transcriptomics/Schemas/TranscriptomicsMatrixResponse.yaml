info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths: {}
components:
  responses:
    TranscriptomicsMatrixResponse:
      content:
        application/json:
          schema:
            title: TranscriptomicsMatrixResponse
            properties:
              '@context':
                $ref: '#/components/schemas/Context'
              metadata:
                $ref: '#/components/schemas/metadata'
              result:
                allOf:
                - $ref: '#/components/schemas/TranscriptomicsInstance'
                - properties:
                    data:
                      items:
                        $ref: '#/components/schemas/TranscriptomicsMatrixRow'
                      type: array
                  required:
                  - data
                  type: object
            required:
            - metadata
            - result
            type: object
      description: OK
      headers: {}
  schemas:
    TranscriptomicsMatrixRow:
      type: object
      properties:
        observationUnitDbId:
          description: Identifier containing the unique observation unit linked to an experiment ID
          type: string
          example: e3675c4a
        sampleDbId:
          description: Identifier containing the unique sample name linked to an experiment ID
          type: string
          example: BB251_101
        tissueType:
          description: Description of the plant part (e.g. leaf) or the plant product (e.g. resin) from which the sample was taken, in the form of an accession number from Plant Ontology
          type: string
          example: PO:0009010; seed
        tissueDevStage:
          description: Stage in life of the plant structure during which the sample was taken, in the form of an accession number from Plant Ontology
          type: string
          example: PO:0001083, inflorescence development stage
        tissueHarvester:
          description: Identifier for the researcher who harvested the tissue 
          type: string
          example: MLWilson
        tissueHarvestDate:
          description: Date of tissue harvest 
          format: date-time
          type: string
          example: 2024-01-02 3:04:05
        comments:
          description: Any comments collected by the researcher during sample preparation and data collection, specific to each scan.
          type: string
          example: Senescing tissue
        row:
          description: description
          type: array
          example: ["0.0355", "0.1442", "0.4322", "0.5473"]
          items:
            type: string