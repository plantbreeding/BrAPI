info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    TranscriptomicsProtocolNewRequest:
      type: object
      properties:
        additionalInfo:
          additionalProperties:
            type: string
          description: Additional arbitrary info
          type: object
        externalReferences: 
          $ref: '#/components/schemas/ExternalReferences'
        libraryMethod:
          description: Technique used to prepare the library
          type: string
          example: 3'RNA-seq
        sequencingCenter:
          description: Where samples are being sequenced if outsourced
          type: string
          example: Cornell University Institute of Biotechnology
        sequencingPlatform:
          description: Technology or system used to perform sequencing 
          type: string
          example: Illumina
        instrumentModel:
          description: The specific equipment used to perform sequencing
          type: string
          example: NextSeq 500
        referenceGenome:
          description: Reference genome used for sequencing alignment
          type: object
          properties: 
            genomeAssemblyName:
              description: The human readable name of the reference genome
              type: string
              example: Zm-B73-REFERENCE-NAM-5.0
            genomeVersion:
              description: the version number of the reference genome
              type: string
              example: '5.0'
            genomeURL:
              description: A URL pointing to the location of the reference genome file. (example file types; .fasta, .fa, etc)
              type: string
              example: https://www.maizegdb.org/genome/assembly/Zm-B73-REFERENCE-NAM-5.0
        annotationFile:
          description: The reference annotation file used
          type: string
          properties: 
            annotationFileName:
              description: The human readable name of the annotation file
              type: string
              example: Zm-234-Annotations-6.1
            annotationFileVersion:
              description: the version of the annotation file
              type: string
              example: '6.1'
            annotationFileURL:
              description: A URL pointing to the location of the annotation file. (example file types; .gff, .gff3, .gtf, etc)
              type: string
              example: https://phytozome-next.jgi.doe.gov/info/Zmays_Zm_B73_REFERENCE_NAM_5_0_55
        units:
          description: Units of sequence input: counts, normalized FPKM, RPKM, TPM, TMM
          type: string
          example: TPM
        readLength:
          description: Read coverage and depth
          type: string
          example: 5x depth with 150 bp reads
        layout:
          description: layout (single vs. paired end reads)
          type: string
          example: Paired end
        nucleicAcidExtractionMethod:
          description: Kit and or method used for nucleic acid extraction (Hot borate, Qiagen kit, etc)
          type: string
          example: Hot borate
        mappingSoftware:
          description: Mapping software used to align reads to a reference genome or transcriptome
          type: string
          example: HISAT2
        countingSoftware:
          description: Counting software used to quantify gene expression levels based on mapped reads
          type: string
          example: Salmon
        libraryComments:
          description: libraryComments
          type: string
          example: We used the 3'RNA-seq method
