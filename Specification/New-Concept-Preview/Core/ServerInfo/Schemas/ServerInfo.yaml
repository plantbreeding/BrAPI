info:
  title: BrAPI
  version: ''
openapi: 3.0.0
paths: {}
components:
  schemas:
    ServerInfo: 
      type: object
      required:
      - calls
      properties:
        contactEmail:
          description: A contact email address for this server management
          type: string
          example: contact@institute.org
        documentationURL:
          description: A URL to the human readable documentation of an object
          type: string
          example: institute.org/server
        organizationURL:
          description: The URL of the organization that manages this server and data
          type: string
          example: institute.org/home
        organizationName:
          description: The name of the organization that manages this server and data
          type: string
          example: The Institute
        serverName:
          description: The name of this server
          type: string
          example: The BrAPI Test Server
        serverDescription:
          description: A description of this server
          type: string
          example: |-
            The BrAPI Test Server
            Web Server - Apache Tomcat 7.0.32
            Database - Postgres 10
            Supported BrAPI Version - V2.0
        location:
          description: Physical location of this server (ie. City, Country)
          type: string
          example: USA
        auth:
          description: |- 
            Details about the authentication system for this server. Examples include the following:
            "authProtocol": "Basic",
            "authProtocolConfigURL": null 
                // A Basic auth token doesn't need any additional params
                // Its base64 encoded username and password sent as a token with every request

            "authProtocol": "OAuth",
            "authProtocolConfigURL": "https://brapi.org/.well-known/openid-configuration"  
                // OIDC Discovery FIle

            "authProtocol": "SAML",
            "authProtocolConfigURL": "https://brapi.org/.well-known/saml-configuration"  
                // whatever the SAML equivalent of OIDC is

            "authProtocol": "Custom",
            "authProtocolConfigURL": "https://not-brapi.org/docs/auth-documentation"  
                // human readable documentation
                // The client either already has all the info it needs for this custom auth protocol for this server,
                // or it doesn't and a dev has to read the documentation to implement it
          type: object
          properties:
            authProtocol: 
              type: string
              description: The auth protocol being used by this server ("Basic", "OAuth", "SAML", or "Custom")
              example: OAuth
            authProtocolConfigURL:
              type: string
              format: uri
              description: The URL where Auth configuration details can be found
              example: https://brapi.org/.well-known/openid-configuration
        calls:
          description: Array of available calls on this server
          items:
            $ref: '#/components/schemas/Service'
          type: array
